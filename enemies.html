<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ez Enemies ID</title>
</head>
<body>
    <h1>Easy Enemies ID</h1>

    <!-- link back to cats page -->
    <div style="text-align:center; margin-bottom:20px;">
      <a href="index.html" class="category-btn" style="display:inline-block;">Go to Cats IDs</a>
    </div>

    <div id="cats-container">
        <!-- แสดงศัตรูแยกตามระดับ (will reuse same JS logic) -->
    </div>

    <div class="auto-select-section">
      <h3>Auto-Select by IDs</h3>
      <textarea id="idInput" placeholder="Paste or type enemy IDs separated by spaces or commas (e.g., 0 1 2 or 10, 20, 30)"></textarea>
      <div class="button-group">
        <button onclick="autoSelectFromInput()">Auto-Select IDs</button>
        <button onclick="clearIdInput()">Clear Input</button>
      </div>
    </div>

    <button onclick="showSelected()">Grab your enemy id</button>
    <button onclick="clearSelected()">Clear Select</button>

    <div id="output">You are not picking any enemies now...</div>

    <script src="script.js"></script>
</body>
</html>
