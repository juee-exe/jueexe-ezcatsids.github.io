<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ez Cats ID V.2</title>
</head>
<body>
    <h1>Easy Cats ID</h1>

  <!-- link to enemies page -->
  <div style="text-align:center; margin-bottom:20px;">
    <a href="enemies.html" class="category-btn" style="display:inline-block;">Go to Enemies IDs</a>
  </div>

  <div id="cats-container">
    <!-- แสดงแมวแยกตามระดับ -->
  </div>

  <div class="auto-select-section">
    <h3>Auto-Select by IDs</h3>
    <textarea id="idInput" placeholder="Paste or type cat IDs separated by spaces or commas (e.g., 0 1 2 or 10, 20, 30)"></textarea>
    <div class="button-group">
      <button onclick="autoSelectFromInput()">Auto-Select IDs</button>
      <button onclick="clearIdInput()">Clear Input</button>
    </div>
  </div>

  <button onclick="showSelected()">Grab your cats id</button>
  <button onclick="clearSelected()">Clear Select</button>

  <div id="output">You not picking any cats now...</div>

  <script src="script.js"></script>
</body>
</html>
